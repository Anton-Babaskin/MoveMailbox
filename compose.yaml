services:
  movemailbox:
    build:
      context: .
      args:
        VERSION: ${MOVEMAILBOX_BUILD_VERSION:-dev}
    image: movemailbox:local
    platform: linux/amd64
    user: "nobody:nogroup"
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      # Localhost-only by default. Put an authenticated HTTPS proxy in front
      # before exposing the application to the internet.
      - "127.0.0.1:8080:8080"
    environment:
      MOVEMAILBOX_ADDR: 0.0.0.0:8080
      MOVEMAILBOX_MAX_CONCURRENT: ${MOVEMAILBOX_MAX_CONCURRENT:-2}
      MOVEMAILBOX_MAX_JOBS: ${MOVEMAILBOX_MAX_JOBS:-256}
      MOVEMAILBOX_HISTORY_TTL: ${MOVEMAILBOX_HISTORY_TTL:-24h}
      MOVEMAILBOX_DATABASE: /data/movemailbox.db
      MOVEMAILBOX_OPEN_BROWSER: "false"
      MOVEMAILBOX_ALLOWED_HOSTS: ${MOVEMAILBOX_ALLOWED_HOSTS:-}
      MOVEMAILBOX_PUBLIC_MODE: ${MOVEMAILBOX_PUBLIC_MODE:-false}
      MOVEMAILBOX_SESSION_SECRET: ${MOVEMAILBOX_SESSION_SECRET:-}
      MOVEMAILBOX_SESSION_TTL: ${MOVEMAILBOX_SESSION_TTL:-24h}
      MOVEMAILBOX_MAX_ACTIVE_PER_SESSION: ${MOVEMAILBOX_MAX_ACTIVE_PER_SESSION:-1}
      MOVEMAILBOX_SESSION_REQUESTS_PER_MINUTE: ${MOVEMAILBOX_SESSION_REQUESTS_PER_MINUTE:-120}
      MOVEMAILBOX_IP_REQUESTS_PER_MINUTE: ${MOVEMAILBOX_IP_REQUESTS_PER_MINUTE:-600}
    read_only: true
    tmpfs:
      # imapsync uses these paths for transient runtime and HOME/work data.
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /var/tmp:size=256m,mode=1777,noexec,nosuid,nodev
    volumes:
      - movemailbox-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${MOVEMAILBOX_PIDS_LIMIT:-256}
    cpus: ${MOVEMAILBOX_CPU_LIMIT:-2.0}
    mem_limit: ${MOVEMAILBOX_MEMORY_LIMIT:-1g}

volumes:
  movemailbox-data:
