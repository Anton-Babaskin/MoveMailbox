name: Feature request
description: Explain a migration problem and the outcome you need.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow without real mailbox data.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Include alternatives and how success would be verified.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local client
        - Hosted backend / worker
        - Migration engine integration
        - Documentation / accessibility
        - Other
