name: Website Pages
on:
  push:
    branches: [main, web/github-pages-seo]
    paths: ['web/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      # На Pages бекенда нет: под этим флагом форма переноса не принимает
      # пароли и не зовёт /api/*, интерфейс остаётся живым для демонстрации.
      - run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_STATIC_SITE: '1'
      # GitHub Pages не даёт выставлять свои заголовки, поэтому политику
      # приходится класть в <meta> на каждую страницу. Когда сайт раздаёт наш
      # Go-сервер, то же делает internal/web/static.go — там шаг не нужен.
      - run: npm run csp
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: web/out
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/web/github-pages-seo')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
