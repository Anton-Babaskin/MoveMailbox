name: Release MoveMailbox preview packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi
          go test -race ./...
          go vet ./...

      - name: Scan reachable dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Verify backup and fault harnesses
        run: |
          GOBIN="${RUNNER_TEMP}/age-bin" go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          AGE_BINARY="${RUNNER_TEMP}/age-bin/age" AGE_KEYGEN_BINARY="${RUNNER_TEMP}/age-bin/age-keygen" python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build Windows, Linux and macOS previews
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            package="movemailbox-${goos}-${goarch}-${RELEASE_TAG}"
            suffix=""
            if [[ "${goos}" == windows ]]; then suffix=".exe"; fi
            mkdir -p "dist/${package}/operations"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X github.com/Anton-Babaskin/MoveMailbox/internal/api.Version=${version}" \
              -o "dist/${package}/movemailbox${suffix}" ./cmd/mailbox-migrator
            cp README.md SECURITY.md docs/LICENSING.md "dist/${package}/"
            cp docs/WORKER.md docs/BACKUP-RUNBOOK.md "dist/${package}/operations/"
            cp scripts/backup_archive.py scripts/backup_validation.py "dist/${package}/operations/"
            printf 'Version: %s\nCommit: %s\nPlatform: %s\n' "${RELEASE_TAG}" "${GITHUB_SHA}" "${target}" > "dist/${package}/BUILD-INFO.txt"
            if [[ "${goos}" == windows ]]; then
              cp scripts/windows/START-DEMO.cmd scripts/windows/START-DEMO-DEBUG.cmd scripts/windows/START-REAL.cmd scripts/windows/README-RU.txt "dist/${package}/"
              (cd dist && zip -qr "${package}.zip" "${package}")
            else
              cp scripts/README-UNIX.txt "dist/${package}/"
              tar -czf "dist/${package}.tar.gz" -C dist "${package}"
            fi
          done
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Smoke test packaged Linux binary
        run: |
          python3 scripts/smoke-remote-worker.py --binary "dist/movemailbox-linux-amd64-${GITHUB_REF_NAME}/movemailbox"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if [[ -f "docs/releases/${GITHUB_REF_NAME}.md" ]]; then
            release_flags+=(--notes-file "docs/releases/${GITHUB_REF_NAME}.md")
          else
            release_flags+=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            --title "MoveMailbox ${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
