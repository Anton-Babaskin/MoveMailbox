name: Release Windows preview

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Verify source
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows preview
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="mailbox-migrator-windows-amd64-${RELEASE_TAG}"
          mkdir -p "dist/${package}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X github.com/Anton-Babaskin/mailbox-migrator/internal/api.Version=${version}" \
            -o "dist/${package}/mailbox-migrator.exe" \
            ./cmd/mailbox-migrator
          cp scripts/windows/START-DEMO.cmd "dist/${package}/"
          cp scripts/windows/START-DEMO-DEBUG.cmd "dist/${package}/"
          cp scripts/windows/README-RU.txt "dist/${package}/"
          cd dist
          zip -r "${package}.zip" "${package}"
          sha256sum "${package}.zip" > "${package}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.zip.sha256 \
            --title "Mailbox Migrator ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${release_flags[@]}"
