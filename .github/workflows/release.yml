name: Release MoveMailbox Windows preview

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi
          go test -race ./...
          go vet ./...

      - name: Scan reachable dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Build Windows preview
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="movemailbox-windows-amd64-${RELEASE_TAG}"
          mkdir -p "dist/${package}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X github.com/Anton-Babaskin/MoveMailbox/internal/api.Version=${version}" \
            -o "dist/${package}/movemailbox.exe" \
            ./cmd/mailbox-migrator
          cp scripts/windows/START-DEMO.cmd "dist/${package}/"
          cp scripts/windows/START-DEMO-DEBUG.cmd "dist/${package}/"
          cp scripts/windows/START-REAL.cmd "dist/${package}/"
          cp scripts/windows/README-RU.txt "dist/${package}/"
          cd dist
          zip -r "${package}.zip" "${package}"
          sha256sum "${package}.zip" > "${package}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.zip.sha256 \
            --title "MoveMailbox ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${release_flags[@]}"
