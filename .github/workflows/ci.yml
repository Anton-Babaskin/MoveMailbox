name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  quality:
    name: Format, test, race, vet and vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check Python test harness syntax
        run: python3 -m compileall -q scripts

      - name: Install pinned backup encryption test tools
        run: |
          GOBIN="${RUNNER_TEMP}/age-bin" go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          echo "${RUNNER_TEMP}/age-bin" >> "$GITHUB_PATH"

      - name: Test APPEND framing and backup rejection
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Scan reachable dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-compile
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=""
          if [[ "${TARGET_GOOS}" == "windows" ]]; then
            suffix=".exe"
          fi
          CGO_ENABLED=0 GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" \
            go build -trimpath \
              -ldflags="-s -w -X github.com/Anton-Babaskin/MoveMailbox/internal/api.Version=ci-${GITHUB_SHA::12}" \
              -o "dist/movemailbox-${TARGET_GOOS}-${TARGET_GOARCH}${suffix}" \
              ./cmd/mailbox-migrator

  docker:
    name: Build hardened Docker image
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --build-arg VERSION="ci-${GITHUB_SHA}" --tag movemailbox:ci .

      - name: Verify image metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect movemailbox:ci --format '{{.Config.User}}')" = "nobody:nogroup"
          test "$(docker image inspect movemailbox:ci --format '{{.Config.Healthcheck.Test}}')" != "[]"

      - name: Verify real imapsync certificate rejection and trusted login
        run: docker build --target tls-test --progress=plain .

      - name: Verify independent API and worker hard-kill recovery
        run: python3 scripts/smoke-remote-worker.py --image movemailbox:ci --rotation

      - name: Set up Go for pinned backup tools
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify encrypted snapshot restore and post-restore demo migration
        run: |
          GOBIN="${RUNNER_TEMP}/age-bin" go install filippo.io/age/cmd/age@v1.3.2 filippo.io/age/cmd/age-keygen@v1.3.2
          sudo python3 scripts/smoke-backup-restore.py --image movemailbox:ci --encrypted --age "${RUNNER_TEMP}/age-bin/age" --age-keygen "${RUNNER_TEMP}/age-bin/age-keygen"

      - name: Verify worker ENOSPC admission and recovery in bounded tmpfs
        run: sudo python3 scripts/smoke-worker-enospc.py --image movemailbox:ci

      - name: Verify active worker ENOSPC terminal recovery without replay
        run: sudo python3 scripts/smoke-worker-enospc.py --image movemailbox:ci --active

      - name: Verify crash during pending terminal write across recovery policies
        run: |
          sudo python3 scripts/smoke-worker-enospc.py --image movemailbox:ci --active --crash
          sudo python3 scripts/smoke-worker-enospc.py --image movemailbox:ci --active --crash --resume-interrupted
          sudo python3 scripts/smoke-worker-enospc.py --image movemailbox:ci --active --crash --resume-interrupted --strict-mirror

      - name: Run container health check with hardened settings
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach \
            --read-only \
            --cap-drop=ALL \
            --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev \
            --tmpfs /var/tmp:size=256m,mode=1777,noexec,nosuid,nodev \
            --tmpfs /data:size=64m,mode=1777,noexec,nosuid,nodev \
            --health-interval=1s \
            --health-timeout=2s \
            --health-start-period=1s \
            --health-retries=10 \
            movemailbox:ci --demo --open=false)"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "${container_id}")"
            if [[ "${status}" == "healthy" ]]; then
              exit 0
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done
          docker logs "${container_id}"
          exit 1
