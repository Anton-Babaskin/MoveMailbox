# Dedicated VM SSH profile. Verify a second key login and sudo before loading.
# Keep the existing listen port/socket and administrator authorized_keys.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:30
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
# Operator tunnel to the private API only. No reverse or arbitrary forwarding.
AllowTcpForwarding local
AllowStreamLocalForwarding no
PermitOpen 127.0.0.1:8080 localhost:8080
LogLevel VERBOSE
