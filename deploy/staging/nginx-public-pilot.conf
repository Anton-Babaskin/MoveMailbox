# Closed HTTPS pilot on the VM. Public :18443 maps to VM :443.
user nginx;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    access_log off;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=pilot:1m rate=2r/s;
    server {
        listen 0.0.0.0:443 ssl;
        server_name staging.movemailbox.com;
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        if ($host != staging.movemailbox.com) { return 421; }
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
        auth_basic "MoveMailbox closed pilot";
        auth_basic_user_file /certs/invited.htpasswd;
        location / {
            limit_req zone=pilot burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host staging.movemailbox.com:18443;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
